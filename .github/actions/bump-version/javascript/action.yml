name: 'Bump Version (JavaScript)'
description: 'Bumps version in package.json and creates a git tag'

inputs:
  bump-type:
    description: 'Version bump type: patch, minor, or major'
    required: true
    default: 'patch'
  token:
    description: 'GitHub token for pushing changes'
    required: true

outputs:
  revision:
    description: Release commit
    value: ${{ steps.release.outputs.revision }}
  version:
    description: 'The new version'
    value: ${{ steps.bump.outputs.version }}

runs:
  using: "composite"
  steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ inputs.token }}
        fetch-depth: 0
        ref: ${{ github.ref_name }}

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Bump version
      id: bump
      shell: bash
      env:
        BUMP_TYPE: ${{ inputs.bump-type }}
      run: |
        case "$BUMP_TYPE" in patch|minor|major) ;; *) exit 1 ;; esac
        # Get current version from package.json
        CURRENT_VERSION=$(node -p "require('./package.json').version")
        echo "Current version: $CURRENT_VERSION"
        
        # Bump version using npm (doesn't commit, just updates package.json)
        npm version "$BUMP_TYPE" --no-git-tag-version
        
        # Get new version
        NEW_VERSION=$(node -p "require('./package.json').version")
        echo "New version: $NEW_VERSION"
        echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

    - id: release
      uses: pablomarelli/homelab-workflows/.github/actions/commit-release@main
      with:
        version: ${{ steps.bump.outputs.version }}
