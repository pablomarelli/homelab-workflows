name: Update infrastructure image
description: Commit an image tag to infrastructure; does not verify ArgoCD or cluster health
inputs:
  app-namespace:
    description: Kubernetes namespace (informational; manifest path is selected by app-name)
    required: true
  app-name:
    description: Application directory in infrastructure
    required: true
  version:
    description: Published image tag to request
    required: true
  token:
    description: Token with infrastructure repository access
    required: true
outputs:
  infra-updated:
    description: True only when a changed infrastructure commit was pushed
    value: ${{ steps.update.outputs.infra-updated }}
  healthy:
    description: Always unknown; GitOps reconciliation is not observed
    value: unknown
runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        repository: pablomarelli/homelab-infra
        ref: main
        token: ${{ inputs.token }}
        fetch-depth: 0
    - id: update
      shell: bash
      env:
        APP_NAME: ${{ inputs.app-name }}
        VERSION: ${{ inputs.version }}
      run: bash "$GITHUB_ACTION_PATH/update.sh"
