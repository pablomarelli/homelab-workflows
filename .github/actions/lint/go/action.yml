name: Go lint
description: Check formatting and vet Go packages
inputs:
  ref:
    description: Checked source revision
    default: ${{ github.sha }}
runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref }}
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
    - shell: bash
      run: |
        test -z "$(gofmt -l $(git ls-files '*.go'))"
        go vet ./...
