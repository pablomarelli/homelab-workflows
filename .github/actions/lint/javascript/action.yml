name: JavaScript lint
description: Run the project's lint script
inputs:
  ref:
    description: Checked source revision
    default: ${{ github.sha }}
  node-version:
    description: Supported Node version
    default: '24'
runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref }}
    - uses: pablomarelli/homelab-workflows/.github/actions/javascript-dependencies@main
      with:
        node-version: ${{ inputs.node-version }}
    - shell: bash
      run: |
        npm run lint
