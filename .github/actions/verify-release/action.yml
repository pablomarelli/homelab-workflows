name: Verify release revision
description: Require successful main-branch CI for the exact current main revision
inputs:
  revision:
    description: Full source commit SHA to publish or deploy
    required: true
runs:
  using: composite
  steps:
    - name: Require successful CI for the current main revision
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
      env:
        RELEASE_REVISION: ${{ inputs.revision }}
        VERIFY_RELEASE_SCRIPT: ${{ github.action_path }}/verify-release.cjs
      with:
        script: |
          const verify = require(process.env.VERIFY_RELEASE_SCRIPT);
          await verify({github, context, revision: process.env.RELEASE_REVISION});
