name: Promote checked candidate
description: Tag the already-built digest only after required checks succeed
inputs:
  image:
    description: Image repository
    required: true
  digest:
    description: Checked candidate digest
    required: true
  version:
    description: Release tag
    required: true
  ref:
    description: Exact checked revision, required to still be main
    required: true
  docker-registry:
    description: Registry for authentication
    default: ghcr.io
  docker-username:
    description: Registry username
    default: ${{ github.actor }}
  docker-password:
    description: Registry password
    required: true
outputs:
  published:
    description: Whether release aliases were published
    value: ${{ steps.promote.outputs.published }}
runs:
  using: composite
  steps:
    - uses: docker/login-action@v3
      with:
        registry: ${{ inputs.docker-registry }}
        username: ${{ inputs.docker-username }}
        password: ${{ inputs.docker-password }}
    - uses: docker/setup-buildx-action@v3
    - id: promote
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        IMAGE: ${{ inputs.image }}
        DIGEST: ${{ inputs.digest }}
        VERSION: ${{ inputs.version }}
        REVISION: ${{ inputs.ref }}
      run: bash "$GITHUB_ACTION_PATH/promote.sh"
