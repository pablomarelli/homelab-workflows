name: Workflow Deployment

on:
  push:
    branches:
      - main
    paths:
      - workflows/**
      - scripts/inject-workflows.sh
      - .github/workflows/deploy-workflows.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  insert-workflows:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: dev-portfolio
            profile: javascript
          - project: easy-media-share
            profile: go-frontend-calver

    steps:
      - name: Checkout Self
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          path: main

      - name: Checkout Project ${{ matrix.project }}
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: "pablomarelli/${{ matrix.project }}"
          token: ${{ secrets.REPOS_TOKEN }}
          path: project

      - name: Insert Workflows
        env:
          PROFILE: ${{ matrix.profile }}
        run: bash main/scripts/inject-workflows.sh main project "$PROFILE"

      - name: Commit Workflows
        run: |

          cd project

          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"

          git add .github/workflows/deploy-prod.yml

          if ! git diff --cached --quiet; then
            git commit -m "Update Github Workflows https://github.com/pablomarelli/homelab-workflows/actions/runs/${{ github.run_id }}"

            git pull --rebase
            git push
          fi
