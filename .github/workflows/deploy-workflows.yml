name: Workflow Deployment

on:
  push:
    branches:
      - main
    paths:
      - workflows/**
      - .github/workflows/deploy-workflows.yml
  workflow_dispatch:

jobs:
  insert-workflows:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - dev-portfolio
          - easy-media-share
          # - finance
          # - home-assistant

    steps:
      - name: Checkout Self
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          path: main

      - name: Checkout Project ${{ matrix.project }}
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: "pablomarelli/${{ matrix.project }}"
          token: ${{ secrets.REPOS_TOKEN }}
          path: project

      - name: Insert Workflows
        run: |
          # NOTE: Determine project language to use for workflows
          cd project
          lang=""
          if [ -f "backend/go.mod" ] && [ -f "frontend/package.json" ] && [ -f "VERSION" ]; then
            lang="go-frontend-calver"
          elif [ -f "requirements.txt" ] || [ -f "pyproject.toml" ] || [ -f "Pipfile" ]; then
            lang="python"
          elif [ -f "package.json" ]; then
            lang="javascript"
          else
            exit 1
          fi
          cd ..

          # Keep existing application CI; only inject deployment templates.
          mkdir -p project/.github/workflows
          workflow_dir=main/workflows
          if [ "$lang" = "go-frontend-calver" ]; then
            workflow_dir="$workflow_dir/go-frontend-calver"
          fi
          for workflow in "$workflow_dir"/*.yml; do
            workflow_name=$(basename "$workflow")
            sed "s/LANGUAGE/$lang/g" "$workflow" > "project/.github/workflows/$workflow_name"
          done

      - name: Commit Workflows
        continue-on-error: true
        run: |

          cd project

          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"

          git add .github/workflows/*

          if [[ $(git status --porcelain) ]]; then
            git commit -a -m "Update Github Workflows https://github.com/pablomarelli/homelab-workflows/actions/runs/${{ github.run_id }}"

            git pull --rebase
            git push
          fi
