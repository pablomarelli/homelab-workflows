name: Checked Family Manager release
on:
  workflow_call:
    inputs:
      language:
        required: true
        type: string
      deploy:
        type: boolean
        default: false
    secrets:
      INFRA_REPO_TOKEN:
        required: false
permissions:
  contents: read
  packages: write
jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Validate runtime
        env:
          LANGUAGE: ${{ inputs.language }}
        run: 'case "$LANGUAGE" in go|javascript) ;; *) exit 1 ;; esac'
      - uses: actions/setup-go@v5
        if: inputs.language == 'go'
        with:
          go-version-file: go.mod
      - name: Check Go application
        if: inputs.language == 'go'
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
          go test -race ./...
          go build ./cmd/server
      - uses: actions/setup-node@v4
        if: inputs.language == 'javascript'
        with:
          node-version: 24
          cache: npm
      - name: Check browser application
        if: inputs.language == 'javascript'
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e
          npm run test:e2e:auth
  publish:
    needs: checks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - id: version
        run: echo "version=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
  deploy:
    if: inputs.deploy
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: pablomarelli/homelab-workflows/.github/actions/argo-deploy@main
        with:
          app-name: ${{ github.event.repository.name }}
          app-namespace: family-manager
          version: ${{ needs.publish.outputs.version }}
          token: ${{ secrets.INFRA_REPO_TOKEN }}
